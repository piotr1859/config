name: Koszalin MZK – Minecraft Bedrock Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/koszalin-bedrock.yml'
      - 'projects/koszalin-minecraft/build-bedrock.sh'
      - 'projects/koszalin-minecraft/mzk-bedrock/**'

permissions:
  contents: write

concurrency:
  group: koszalin-mzk-bedrock-build
  cancel-in-progress: true

jobs:
  build-bedrock:
    name: Build self-contained Android .mcworld
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audio and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg python3-pil zip unzip

      - name: Build and validate Koszalin MZK world
        run: bash projects/koszalin-minecraft/build-bedrock.sh

      - name: Check Bedrock Script API compatibility
        run: |
          npm --cache "$RUNNER_TEMP/npm-cache" install \
            --prefix "$RUNNER_TEMP/koszalin-typecheck" \
            --no-save --ignore-scripts \
            typescript@latest @minecraft/server@2.0.0
          "$RUNNER_TEMP/koszalin-typecheck/node_modules/.bin/tsc" \
            --allowJs --checkJs --noEmit \
            --moduleResolution bundler --module es2022 --target es2022 \
            --skipLibCheck --noImplicitAny false \
            --typeRoots "$RUNNER_TEMP/koszalin-typecheck/node_modules" \
            build/koszalin-mzk-bedrock/work/world/behavior_packs/KoszalinMZK_BP/scripts/main.js \
            build/koszalin-mzk-bedrock/work/world/behavior_packs/KoszalinMZK_BP/scripts/data.js

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: koszalin-mzk-build-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/koszalin-mzk-bedrock/dist/Koszalin_MZK_build_report.json
            build/koszalin-mzk-bedrock/dist/Koszalin_MZK_Android.mcworld.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android world as latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="koszalin-mzk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Koszalin MZK Bedrock – build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          DIST="build/koszalin-mzk-bedrock/dist"

          gh release create "$TAG" \
            "$DIST/Koszalin_MZK_Android.mcworld" \
            "$DIST/Koszalin_MZK_Android.mcworld.sha256" \
            "$DIST/Koszalin_MZK_build_report.json" \
            --title "$TITLE" \
            --notes-file "$DIST/RELEASE_NOTES.md" \
            --latest
