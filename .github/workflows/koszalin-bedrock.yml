name: Koszalin 1:1 Minecraft Bedrock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/koszalin-bedrock.yml'
      - 'projects/koszalin-minecraft/build-bedrock.sh'
      - 'projects/koszalin-minecraft/config.env'

permissions:
  contents: write

concurrency:
  group: koszalin-minecraft-bedrock-build
  cancel-in-progress: false

jobs:
  build-bedrock:
    name: Generate Koszalin Bedrock .mcworld
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Arnis Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgtk-3-dev \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev

      - name: System information
        run: |
          uname -a
          nproc
          free -h
          df -h

      - name: Generate Koszalin Bedrock world
        run: bash projects/koszalin-minecraft/build-bedrock.sh

      - name: Prepare release notes
        run: |
          cat > build/koszalin-bedrock/dist/RELEASE_NOTES.md <<'EOF_NOTES'
          # Koszalin 1:1 – Minecraft Bedrock / Android

          Gotowy świat Koszalina w formacie `.mcworld`, przeznaczony m.in. do Minecraft Bedrock na Androidzie.

          - skala: 1 blok = 1 metr
          - rzeczywiste ukształtowanie terenu
          - budynki, drogi, kolej, wody i pozostałe obiekty przetwarzane przez Arnis
          - spawn: Rynek Staromiejski
          - tryb gry: Creative
          - silnik: Arnis v3.0.0

          Na telefonie pobierz `Koszalin_1_to_1_Bedrock.mcworld` i otwórz go aplikacją Minecraft.
          EOF_NOTES

      - name: Publish Bedrock world as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="koszalin-bedrock-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Koszalin 1:1 Bedrock – build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          DIST="build/koszalin-bedrock/dist"

          gh release create "$TAG" \
            "$DIST/Koszalin_1_to_1_Bedrock.mcworld" \
            "$DIST/Koszalin_1_to_1_Bedrock.mcworld.sha256" \
            --title "$TITLE" \
            --notes-file "$DIST/RELEASE_NOTES.md" \
            --latest
